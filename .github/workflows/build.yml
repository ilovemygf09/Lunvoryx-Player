name: Build and Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint (Preview)
        run: ./gradlew lintPreview --no-daemon

      - name: Assemble Preview APK
        run: ./gradlew assemblePreview --no-daemon

      - name: Upload Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: LunvoryxPlayer-Preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
